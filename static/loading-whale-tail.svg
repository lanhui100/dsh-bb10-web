<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" class="ds-whale-loading" aria-label="正在加载...">
  <style>
    @keyframes dsWhaleBreathe {
      0%, 100% {
        -webkit-transform: translateY(0px) rotate(0deg);
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        -webkit-transform: translateY(-1.5px) rotate(-0.6deg);
        transform: translateY(-1.5px) rotate(-0.6deg);
      }
    }
    @-webkit-keyframes dsWhaleBreathe {
      0%, 100% {
        -webkit-transform: translateY(0px) rotate(0deg);
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        -webkit-transform: translateY(-1.5px) rotate(-0.6deg);
        transform: translateY(-1.5px) rotate(-0.6deg);
      }
    }
    @keyframes dsWhaleTailWag {
      0%, 100% {
        -webkit-transform: rotate(-14deg);
        transform: rotate(-14deg);
      }
      50% {
        -webkit-transform: rotate(14deg);
        transform: rotate(14deg);
      }
    }
    @-webkit-keyframes dsWhaleTailWag {
      0%, 100% {
        -webkit-transform: rotate(-14deg);
        transform: rotate(-14deg);
      }
      50% {
        -webkit-transform: rotate(14deg);
        transform: rotate(14deg);
      }
    }
    @keyframes dsWaterRipple {
      0%, 100% {
        opacity: 0.35;
        -webkit-transform: scaleX(0.88);
        transform: scaleX(0.88);
      }
      50% {
        opacity: 0.85;
        -webkit-transform: scaleX(1.12);
        transform: scaleX(1.12);
      }
    }
    @-webkit-keyframes dsWaterRipple {
      0%, 100% {
        opacity: 0.35;
        -webkit-transform: scaleX(0.88);
      }
      50% {
        opacity: 0.85;
        -webkit-transform: scaleX(1.12);
      }
    }
    .whale-swim-group {
      -webkit-animation: dsWhaleBreathe 2s ease-in-out infinite;
      animation: dsWhaleBreathe 2s ease-in-out infinite;
    }
    .whale-tail-rotor {
      -webkit-animation: dsWhaleTailWag 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      animation: dsWhaleTailWag 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .water-line-ripple {
      -webkit-transform-origin: 32px 55px;
      transform-origin: 32px 55px;
      -webkit-animation: dsWaterRipple 1.8s ease-in-out infinite;
      animation: dsWaterRipple 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Water Surface Line Ripples -->
  <g class="water-line-ripple">
    <path d="M12 55 C22 53.5 42 53.5 52 55" fill="none" stroke="#2B7FFF" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />
    <path d="M18 58 C26 57 38 57 46 58" fill="none" stroke="#4D6BFE" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
  </g>

