          fill="none"
          stroke="#2B7FFF"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.85" />

    <!-- Articulated Official DeepSeek Tail Fluke (Pivots at Exact Stalk Junction 46.4, 25.6) -->
    <g transform="translate(46.4, 25.6)">
      <g class="whale-tail-rotor">
        <path d="M11.2,-5.6L11.2,-4.0L9.6,-4.0L9.6,-2.4L8.0,-2.4L8.0,-0.8L3.2,-0.8L3.2,0.8L-1.6,0.8L-1.6,-0.8L-3.2,-0.8L-3.2,-2.4L-4.8,-2.4L-4.8,-4.0L-6.4,-4.0L-6.4,-13.6L-3.2,-13.6L-3.2,-12.0L-1.6,-12.0L-1.6,-10.4L0.0,-10.4L0.0,-8.8L8.0,-8.8L8.0,-10.4L11.2,-10.4Z"
              fill="none"
              stroke="#4D6BFE"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round" />

        <!-- Fluke Spine Detail Line -->
        <path d="M0 0 L-2.4 -9.6"
              fill="none"
              stroke="#85A5FF"
              stroke-width="1.3"
              stroke-linecap="round"
              opacity="0.8" />

        <!-- SMIL Spline Fallback for WebKit 537.35+ -->
        <animateTransform attributeName="transform" type="rotate"
          values="-14; 14; -14"
          keyTimes="0; 0.5; 1"
          calcMode="spline"
          keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
          dur="1.1s" repeatCount="indefinite" />
      </g>
    </g>
  </g>
</svg>
