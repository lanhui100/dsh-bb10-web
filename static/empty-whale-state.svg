        opacity: 0.25;
        -webkit-transform: translateX(1.2px);
        transform: translateX(1.2px);
      }
      50% {
        opacity: 0.55;
        -webkit-transform: translateX(-1.2px);
        transform: translateX(-1.2px);
      }
    }
    @-webkit-keyframes dsPixelWave2 {
      0%, 100% {
        opacity: 0.25;
        -webkit-transform: translateX(1.2px);
      }
      50% {
        opacity: 0.55;
        -webkit-transform: translateX(-1.2px);
      }
    }
    .whale-float-group {
      -webkit-animation: dsWhaleBreathe 4.2s ease-in-out infinite;
      animation: dsWhaleBreathe 4.2s ease-in-out infinite;
    }
    .wave-pixel-1 {
      -webkit-animation: dsPixelWave1 3.4s ease-in-out infinite;
      animation: dsPixelWave1 3.4s ease-in-out infinite;
    }
    .wave-pixel-2 {
      -webkit-animation: dsPixelWave2 2.6s ease-in-out infinite;
      animation: dsPixelWave2 2.6s ease-in-out infinite;
    }
