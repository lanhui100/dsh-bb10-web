# Nginx reverse proxy configuration for dsh-q20-web
# Optimized for BlackBerry Q20 (BB10 WebKit) and real-time SSE / streaming

server {
    listen 80;
    server_name q20.example.com; # Replace with your domain or IP

    # Logging
    access_log /var/log/nginx/dsh-q20-web.access.log;
    error_log /var/log/nginx/dsh-q20-web.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3090;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / multiplexed stream support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming real-time latency optimization
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
